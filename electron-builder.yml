appId: com.jmoyers.everquest-companion
productName: EQ Legends Companion
copyright: Copyright © 2026 Josh Moyers

directories:
  buildResources: build
  output: release/${version}

# electron-vite bundles main/preload/renderer into out/. Ship that plus the
# externalized production dependencies (electron-store, chokidar, …).
files:
  - out/**
  - package.json
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/*.{o,obj,map,ts,tsx}'

asarUnpack:
  - resources/**

# npmRebuild defaults to TRUE, which makes electron-builder shell out to
# @electron/rebuild -> node-gyp against the whole production tree at package
# time. This project has NO native modules (chokidar 4, electron-store/conf and
# electron-updater are pure JS; there is not a single binding.gyp or prebuilt
# .node in the tree), so that pass rebuilds nothing — it only keeps a
# compile-and-execute path wired into every build, which is exactly the kind of
# step `.npmrc`'s ignore-scripts is there to close. Turning it off is a no-op for
# output and removes the path. If a native dependency is ever added, this must
# flip back to true (or `electron-builder install-app-deps` must run explicitly)
# or the module will ship built against the wrong ABI.
npmRebuild: false

# Auto-update + release hosting: electron-updater pulls from GitHub Releases of
# this repo. The CI workflows (.github/workflows) publish here; the app reads
# latest*.yml from the same owner/repo. `channel` is per-release (main vs latest).
publish:
  provider: github
  owner: jmoyers
  repo: everquest-companion

win:
  target:
    - target: nsis
      arch:
        - x64
  # Brand the exe + installer with our generated mark (scripts/gen-icon.mts).
  icon: build/icon.ico
  # We sign+edit the exe so it carries the icon + version metadata (rcedit). This
  # needs winCodeSign extracted into the electron-builder cache; on Windows that
  # requires either Developer Mode (symlink privilege) OR the manual cache-seed
  # workaround (see scripts/seed-wincodesign.ps1). CI builds are SIGNED via Azure
  # Artifact Signing (account jmoyers-eqtools, profile eq-companion-public — the
  # azureSignOptions args are injected by build.yml when the AZURE_* secrets
  # exist); local `npm run dist` builds stay unsigned.
  signAndEditExecutable: true
  # CUSTOM SIGN HOOK (not azureSignOptions): the built-in Azure path splices file
  # paths into a pwsh -Command string UNQUOTED, so our space-bearing exe name
  # ("EQ Legends Companion.exe") splits and signing fails with "File not found:
  # ...\EQ" (upstream: @electron/windows-sign#45). The hook passes paths as real
  # arguments instead. It self-skips when the AZURE_* env is absent, so local
  # dist builds stay unsigned; CI injects the env and signs.
  sign: scripts/azure-sign.cjs
  # UPDATE SIGNATURE VERIFICATION (do not remove): electron-updater's
  # NsisUpdater.verifySignature SKIPS all checking when publisherName is null —
  # a signed build alone protects nothing on the update path. This name must
  # exactly match the certificate subject CN (Azure profile eq-companion-public).
  # With it set, every downloaded update must carry a valid Authenticode
  # signature from this publisher or it is rejected before install.
  publisherName: Joshua Moyers

# One-click installer (Discord model): double-click installs per-user under
# %LOCALAPPDATA%\Programs (no UAC prompt), then launches. Friendly for friends
# who don't want an install wizard. Uninstall keeps app data (settings/logs).
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EQ Legends Companion
  artifactName: everquest-companion-Setup-${version}.${ext}
