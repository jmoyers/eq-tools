<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: eqimg:; script-src 'self'"
    />
    <title>DPS Overlay</title>
    <style>
      /* Transparent window: the OS composites the game underneath. Element-level
         rgba backgrounds (set in React) provide the translucent panel; the page
         itself paints nothing. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      #overlay-root {
        width: 100vw;
        height: 100vh;
      }
      /* Themed scrollbars — same treatment as the main app (theme.ts
         MuiCssBaseline); the overlay entry has no CssBaseline, so plain CSS. */
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(217, 178, 95, 0.35) transparent;
      }
      *::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      *::-webkit-scrollbar-track {
        background: transparent;
      }
      *::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      *::-webkit-scrollbar-thumb:hover {
        background-color: rgba(255, 255, 255, 0.3);
      }
      *::-webkit-scrollbar-corner {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="overlay-root"></div>
    <script type="module" src="/src/overlay/main.tsx"></script>
  </body>
</html>
